
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Boost AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>🚀 Viral Boost AI</h1>
    <p>صايب محتوى فيديو احترافي وزيد فرص الانتشار</p>

    <label>المنصة</label>
    <select id="platform">
      <option>Facebook Reels</option>
      <option>TikTok</option>
      <option>YouTube Shorts</option>
    </select>

    <label>موضوع الفيديو</label>
    <textarea id="idea" placeholder="كتب موضوع الفيديو ديالك هنا..."></textarea>

    <label>مدة الفيديو</label>
    <select id="duration">
      <option value="30">30 ثانية</option>
      <option value="60">60 ثانية</option>
    </select>

    <button id="generate">إنشاء المحتوى</button>
    <div id="result"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
